# Local Nakama server for development (free, runs on this Mac).
# Start:  docker compose up -d      Stop: docker compose down
# Data is kept in the "pgdata" volume between restarts.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nakama
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdb}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # local only
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nakama"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  nakama:
    image: heroiclabs/nakama:3.41.0
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        /nakama/nakama migrate up --database.address postgres:${POSTGRES_PASSWORD:-localdb}@postgres:5432/nakama &&
        exec /nakama/nakama --name nakama1
        --database.address postgres:${POSTGRES_PASSWORD:-localdb}@postgres:5432/nakama
        --socket.server_key ${NAKAMA_SERVER_KEY:-defaultkey}
        --console.username ${NAKAMA_CONSOLE_USER:-admin}
        --console.password ${NAKAMA_CONSOLE_PASSWORD:-password}
        --session.encryption_key ${NAKAMA_SESSION_KEY:-defaultencryptionkey}
        --session.refresh_encryption_key ${NAKAMA_REFRESH_KEY:-defaultrefreshencryptionkey}
        --runtime.http_key ${NAKAMA_HTTP_KEY:-defaulthttpkey}
        --console.signing_key ${NAKAMA_CONSOLE_SIGNING_KEY:-defaultsigningkey}
        --runtime.env "fair_always_open=${FAIR_ALWAYS_OPEN:-false}"
        --runtime.env "pubs_always_open=${PUBS_ALWAYS_OPEN:-false}"
        --runtime.env "markets_always_open=${MARKETS_ALWAYS_OPEN:-false}"
        --runtime.env "boxing_always_open=${BOXING_ALWAYS_OPEN:-false}"
        --runtime.env "chance_games=${CHANCE_GAMES:-false}"
        --session.token_expiry_sec 7200
        --logger.level INFO
    volumes:
      - ./nakama/modules:/nakama/data/modules
    ports:
      - "7350:7350"             # client API — reachable from iPhone on the same Wi-Fi
      - "127.0.0.1:7349:7349"   # gRPC, local only
      - "127.0.0.1:7351:7351"   # admin console, local only
    restart: unless-stopped

volumes:
  pgdata:
