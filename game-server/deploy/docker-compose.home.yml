# Home server (Proxmox VM / Ubuntu) for Thai Life Simulator. Same as the cloud setup but without
# Caddy: Tailscale Funnel gives the public HTTPS address and forwards it to Nakama on port 7350.
# Port 7350 is also open on the LAN so phones on the home Wi-Fi can connect directly.
#
#   docker compose -f docker-compose.home.yml --env-file .env.prod up -d
#   FAIR_ALWAYS_OPEN=true docker compose ... up -d nakama   # test switch (fair open all day); run again without it to switch off
#   sudo tailscale funnel --bg 7350                       # https://<machine>.<tailnet>.ts.net -> Nakama
#   sudo tailscale funnel --bg --set-path /privacy "$PWD/site/privacy"   # privacy policy page
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nakama
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nakama"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  nakama:
    image: heroiclabs/nakama:3.41.0
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        /nakama/nakama migrate up --database.address postgres:${POSTGRES_PASSWORD}@postgres:5432/nakama &&
        exec /nakama/nakama --name nakama1
        --database.address postgres:${POSTGRES_PASSWORD}@postgres:5432/nakama
        --socket.server_key ${NAKAMA_SERVER_KEY:?}
        --console.username ${NAKAMA_CONSOLE_USER:?}
        --console.password ${NAKAMA_CONSOLE_PASSWORD:?}
        --session.encryption_key ${NAKAMA_SESSION_KEY:?}
        --session.refresh_encryption_key ${NAKAMA_REFRESH_KEY:?}
        --runtime.http_key ${NAKAMA_HTTP_KEY:?}
        --console.signing_key ${NAKAMA_CONSOLE_SIGNING_KEY:?}
        --session.token_expiry_sec 7200
        --session.refresh_token_expiry_sec 2592000
        --logger.level INFO
        --runtime.env "fair_always_open=${FAIR_ALWAYS_OPEN:-false}"
        --runtime.env "pubs_always_open=${PUBS_ALWAYS_OPEN:-false}"
        --runtime.env "markets_always_open=${MARKETS_ALWAYS_OPEN:-false}"
        --runtime.env "boxing_always_open=${BOXING_ALWAYS_OPEN:-false}"
        --runtime.env "chance_games=${CHANCE_GAMES:-false}"
    volumes:
      - ../nakama/modules:/nakama/data/modules:ro
    ports:
      - "7350:7350"             # game API: LAN + Tailscale Funnel
      - "127.0.0.1:7351:7351"   # admin console: SSH tunnel only
    restart: unless-stopped

volumes:
  pgdata:
