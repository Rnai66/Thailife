# Production server for Thai Life Simulator on a cloud VPS (any provider that runs Docker).
# Caddy gets a free HTTPS certificate for your domain and forwards it to Nakama, so the game
# connects with https://<domain>:443. Postgres and the Nakama console are NOT exposed to the internet
# (open the console with an SSH tunnel, see DEPLOY.md). No test switches: events follow the calendar.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nakama
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nakama"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  nakama:
    image: heroiclabs/nakama:3.41.0
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        /nakama/nakama migrate up --database.address postgres:${POSTGRES_PASSWORD}@postgres:5432/nakama &&
        exec /nakama/nakama --name nakama1
        --database.address postgres:${POSTGRES_PASSWORD}@postgres:5432/nakama
        --socket.server_key ${NAKAMA_SERVER_KEY:?}
        --console.username ${NAKAMA_CONSOLE_USER:?}
        --console.password ${NAKAMA_CONSOLE_PASSWORD:?}
        --session.encryption_key ${NAKAMA_SESSION_KEY:?}
        --session.refresh_encryption_key ${NAKAMA_REFRESH_KEY:?}
        --runtime.http_key ${NAKAMA_HTTP_KEY:?}
        --console.signing_key ${NAKAMA_CONSOLE_SIGNING_KEY:?}
        --session.token_expiry_sec 7200
        --session.refresh_token_expiry_sec 2592000
        --logger.level INFO
    volumes:
      - ../nakama/modules:/nakama/data/modules:ro
    ports:
      - "127.0.0.1:7351:7351"   # admin console: only through an SSH tunnel
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    depends_on:
      - nakama
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env.prod}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
